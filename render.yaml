services:
  - type: web
    name: pivok-studio
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_SECRET_PASSWORD
        value: pivok
      - key: ALLOWED_USER_IDS
        value: "7042397101"
